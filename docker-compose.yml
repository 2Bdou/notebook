version: "3.8"

services:
  backend:
    build: ./backend
    container_name: notebook-api
    restart: unless-stopped
    volumes:
      - ./data:/app/data
    environment:
      - DB_PATH=/app/data/notebook.db
      - SECRET_KEY=${SECRET_KEY:-notebook-secret-key-change-in-production}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-10080}
      - ALLOW_REGISTRATION=${ALLOW_REGISTRATION:-true}
      - REGISTRATION_CODE=${REGISTRATION_CODE:-}
      - REGISTRATION_IP_HOURLY_LIMIT=${REGISTRATION_IP_HOURLY_LIMIT:-3}
      - AUTH_RATE_LIMIT_PER_MINUTE=${AUTH_RATE_LIMIT_PER_MINUTE:-20}
    expose:
      - "8000"

  frontend:
    build: ./frontend
    container_name: notebook-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - backend
